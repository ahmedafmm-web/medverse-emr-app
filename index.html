<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- 🚫 منع المتصفح من تخزين النسخة القديمة نهائياً -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>MedVerse EMR</title>
  
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div id="root"></div>

  <script>
    // 🔄 كود إعادة التحميل التلقائي فور وجود أي تحديث جديد على GitHub
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          // فحص السيرفر كل 30 ثانية بحثاً عن أي push جديد
          setInterval(() => {
            reg.update();
          }, 30000);

          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // يعمل Refresh تلقائي فوراً أول ما ترفع تعديل جديد
                window.location.reload(true);
              }
            });
          });
        });
      });
    }
  </script>
</body>
</html>
