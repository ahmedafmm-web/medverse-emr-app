<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- 🚫 منع التخزين المؤقت لضمان التحديث التلقائي الفوري -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>MedVerse Smart EMR Suite</title>
  
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div id="app"></div>

  <script>
    // حالة الواجهة البياناتية (جلب المفتاح المحفوظ من ذاكرة المتصفح إن وجد)
    let state = {
      apiKey: localStorage.getItem('MEDVERSE_GEMINI_KEY') || '',
      patientName: '',
      age: '',
      phone: '',
      gender: 'ذكر',
      chronicDiseases: '',
      familyHistory: '',
      symptoms: '',
      analyzing: false,
      aiReport: null,
      finalDiagnosis: '',
      medications: []
    };

    const app = document.getElementById('app');

    function render() {
      app.innerHTML = `
        <div class="min-h-screen pb-12 max-w-2xl mx-auto p-4 space-y-5">
          
          <!-- Header -->
          <header class="text-center py-4 border-b border-slate-800">
            <h1 class="text-2xl font-bold text-sky-400">MedVerse Smart EMR Suite</h1>
            <p class="text-xs text-sky-500 font-semibold mt-1">الاستشاري الإكلينيكي الذكي (Powered by Gemini AI)</p>
          </header>

          <!-- ⚙️ إعدادات المفتاح الآمنة (Client-Side Storage) -->
          <section class="bg-slate-800/80 p-4 rounded-2xl border border-sky-900/50 space-y-2">
            <div class="flex justify-between items-center">
              <label class="text-xs font-bold text-sky-300 flex items-center gap-1">
                <span>🔑</span> مفتاح Gemini API الخاص بك:
              </label>
              ${state.apiKey ? '<span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded-full">محفوظ آمن آلياً ✓</span>' : '<span class="text-[10px] bg-amber-950 text-amber-400 border border-amber-800 px-2 py-0.5 rounded-full">مطلوب للتحليل الذكي</span>'}
            </div>
            <div class="flex gap-2">
              <input 
                id="apiKeyInput" 
                type="password" 
                placeholder="أدخل المفتاح الذي ينتهي بـ AQ... أو يبدأ بـ AIzaSy..." 
                value="${state.apiKey}" 
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-sky-500" 
              />
              <button id="saveKeyBtn" class="bg-sky-600 hover:bg-sky-500 text-xs font-bold px-4 py-2 rounded-xl text-white transition-all">
                حفظ
              </button>
            </div>
          </section>

          <!-- 1. البيانات الشخصية والمرضية -->
          <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
            <h2 class="font-bold text-sm text-slate-200 border-b border-slate-700 pb-2 flex items-center gap-2">
              <span>👤</span> البيانات الشخصية والمرضية الشاملة
            </h2>

            <div>
              <label class="block text-xs text-slate-400 mb-1">اسم المريض بالكامل *</label>
              <input id="pName" type="text" placeholder="أدخل اسم المريض..." value="${state.patientName}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-slate-400 mb-1">السن</label>
                <input id="pAge" type="number" placeholder="مثال: 35" value="${state.age}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">رقم الهاتف</label>
                <input id="pPhone" type="tel" placeholder="01xxxxxxxxx" value="${state.phone}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" />
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">الأمراض الحالية والمزمنة (إن وجدت)</label>
              <input id="pChronic" type="text" placeholder="مثال: ضغط، سكر، حساسية بنسلين..." value="${state.chronicDiseases}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" />
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">التاريخ المرضي العائلي (Family History)</label>
              <input id="pFamily" type="text" placeholder="مثال: تاريخ عائلي لأمراض القلب..." value="${state.familyHistory}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" />
            </div>
          </section>

          <!-- 2. الشكوى والتحليل الذكي -->
          <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
            <h2 class="font-bold text-sm text-slate-200 border-b border-slate-700 pb-2 flex items-center gap-2">
              <span>🩺</span> الأعراض والشكوى الحالية
            </h2>

            <textarea id="pSymptoms" rows="3" placeholder="صف الأعراض وملاحظات الكشف بالتفصيل..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500">${state.symptoms}</textarea>

            <button id="aiBtn" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-sky-600/30 flex items-center justify-center gap-2">
              ${state.analyzing ? '⏳ جاري التحليل برادارات Gemini...' : '✨ تحليل الحالة بـ Gemini AI وكشف التعارضات'}
            </button>

            ${state.aiReport ? `
              <div class="bg-sky-950/40 border border-sky-800 p-4 rounded-xl space-y-3">
                <h3 class="text-xs font-bold text-sky-400">📋 التقرير الاستشاري المولد من Gemini AI:</h3>
                
                ${state.aiReport.warnings && state.aiReport.warnings.length > 0 ? `
                  <div class="bg-red-950/50 border border-red-800 p-3 rounded-lg text-red-300 text-xs space-y-1">
                    ${state.aiReport.warnings.map(w => `<div>⚠️ ${w}</div>`).join('')}
                  </div>
                ` : ''}

                <div class="text-xs text-slate-200">
                  <strong>التشخيص المقترح:</strong> ${state.aiReport.diagnosis}
                </div>
              </div>
            ` : ''}
          </section>

          <!-- 3. اعتماد القرارات والأدوية -->
          <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
            <h2 class="font-bold text-sm text-slate-200 border-b border-slate-700 pb-2 flex items-center gap-2">
              <span>📝</span> مراجعة القرارات الطبية والتعديل الحر
            </h2>
            <p class="text-xs text-sky-400">* يحق للطبيب تعديل أو إضافة أو حذف أي عنصر من الخطة العلاجية.</p>

            <div>
              <label class="block text-xs text-slate-400 mb-1">التشخيص المعتمد النهائي:</label>
              <textarea id="pDiag" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500">${state.finalDiagnosis}</textarea>
            </div>

            <!-- قائمة الأدوية -->
            <div class="space-y-3">
              <h3 class="text-xs font-bold text-sky-400">💊 قائمة الأدوية المعتمدة (${state.medications.length}):</h3>
              ${state.medications.map((m, idx) => `
                <div class="bg-slate-900 border border-slate-700 p-3 rounded-xl space-y-1 relative">
                  <button onclick="removeMed(${idx})" class="absolute left-3 top-3 text-red-400 text-xs font-bold">إزالة ✕</button>
                  <div class="font-bold text-sm text-white">💊 ${m.name}</div>
                  <div class="text-xs text-slate-400"><strong>الجرعة:</strong> ${m.dose}</div>
                  <div class="text-xs text-slate-400"><strong>السبب:</strong> ${m.reason}</div>
                </div>
              `).join('')}
            </div>

            <!-- إضافة دواء يدوي -->
            <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700 space-y-2">
              <label class="block text-xs text-slate-400">إضافة دواء جديد يدوياً للروشتة:</label>
              <input id="mName" type="text" placeholder="اسم الدواء..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white" />
              <input id="mDose" type="text" placeholder="الجرعة واستعمالها..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white" />
              <button id="addMedBtn" class="w-full bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 rounded-lg text-white">
                + إضافة الدواء للقائمة
              </button>
            </div>
          </section>

          <!-- زر الاعتماد والطباعة -->
          <button id="saveBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-emerald-600/20 text-base">
            اعتماد التقرير وإصدار الروشتة المعتمدة 🖨️
          </button>

        </div>
      `;

      bindEvents();
    }

    function bindEvents() {
      // حفظ المفتاح في LocalStorage
      document.getElementById('saveKeyBtn').onclick = () => {
        const val = document.getElementById('apiKeyInput').value.trim();
        if (val) {
          state.apiKey = val;
          localStorage.setItem('MEDVERSE_GEMINI_KEY', val);
          alert('تم حفظ مفتاح API بنجاح في جهازك! 🔑');
          render();
        } else {
          alert('يرجى كتابة المفتاح أولاً');
        }
      };

      // مزامنة المدخلات
      document.getElementById('pName').onchange = (e) => state.patientName = e.target.value;
      document.getElementById('pAge').onchange = (e) => state.age = e.target.value;
      document.getElementById('pPhone').onchange = (e) => state.phone = e.target.value;
      document.getElementById('pChronic').onchange = (e) => state.chronicDiseases = e.target.value;
      document.getElementById('pFamily').onchange = (e) => state.familyHistory = e.target.value;
      document.getElementById('pSymptoms').onchange = (e) => state.symptoms = e.target.value;
      document.getElementById('pDiag').onchange = (e) => state.finalDiagnosis = e.target.value;

      // زر تحليل Gemini AI
      document.getElementById('aiBtn').onclick = handleAiAnalysis;

      // زر إضافة دواء
      document.getElementById('addMedBtn').onclick = () => {
        const name = document.getElementById('mName').value;
        const dose = document.getElementById('mDose').value;
        if (name.trim()) {
          state.medications.push({ name, dose: dose || 'حسب إرشادات الطبيب', reason: 'إضافة يدوية' });
          render();
        }
      };

      // زر الحفظ
      document.getElementById('saveBtn').onclick = () => {
        if (!state.patientName.trim()) {
          alert('يرجى إدخال اسم المريض أولاً');
          return;
        }
        alert('تم اعتماد الكشف والتقرير بنجاح! 🚀');
      };
    }

    window.removeMed = function(idx) {
      state.medications.splice(idx, 1);
      render();
    };

    async function handleAiAnalysis() {
      if (!state.apiKey) {
        alert('يرجى إدخال مفتاح Gemini API الخاص بك في الخانة المخصصة بالأعلى أولاً.');
        return;
      }

      const symptoms = document.getElementById('pSymptoms').value;
      if (!symptoms.trim()) {
        alert('يرجى كتابة الأعراض والشكوى الحالية للمريض أولاً.');
        return;
      }

      state.analyzing = true;
      render();

      const promptText = `
أنت استشاري طبي وتعمل كمساعد إكلينيكي في نظام EMR.
قم بتحليل بيانات المريض التالية بجدية ودقة طبية عالية:
- السن: ${state.age || 'غير محدد'}
- النوع: ${state.gender}
- الأمراض المزمنة/الحالية: ${state.chronicDiseases || 'لا يوجد'}
- التاريخ المرضي العائلي: ${state.familyHistory || 'لا يوجد'}
- الشكوى والأعراض الحالية: ${symptoms}

المطلوب: ارسل الإجابة فقط بتنسيق JSON صحيح تماماً بدون أي علامات markdown أو أسطر إضافية:
{
  "diagnosis": "التشخيص الدقيق باللغة العربية مع الاسم العلمي",
  "warnings": ["قائمة بأي تعارضات دارجية أو محاذير إن وجدت"],
  "medications": [
    {
      "name": "اسم الدواء الشهير",
      "dose": "الجرعة المقترحة",
      "reason": "سبب الاختيار"
    }
  ]
}
`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${state.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });

        if (!res.ok) {
          throw new Error('API Key Issue');
        }

        const data = await res.json();
        let rawText = data.candidates[0].content.parts[0].text;
        rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(rawText);

        state.aiReport = parsed;
        state.finalDiagnosis = parsed.diagnosis || '';
        state.medications = parsed.medications || [];
      } catch (err) {
        alert('حدثت مشكلة أثناء الاتصال بـ Gemini AI. يرجى التأكد من صحة المفتاح المدخل ومن الاتصال.');
      } finally {
        state.analyzing = false;
        render();
      }
    }

    render();

    // 🔄 كود التحديث الفوري المباشر
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          setInterval(() => { reg.update(); }, 30000);
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                window.location.reload(true);
              }
            });
          });
        });
      });
    }
  </script>
</body>
</html>
