<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>MedVerse Smart EMR Suite</title>
  
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div id="app"></div>

  <script>
    let state = {
      apiKey: localStorage.getItem('MEDVERSE_HF_KEY') || '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',
      patientName: '',
      age: '',
      gender: 'ذكر',
      phone: '',
      chronicDiseases: '',
      familyHistory: '',
      currentMedications: '',
      symptoms: '',
      analyzing: false,
      aiReport: null,
      apiError: null,
      finalDiagnosis: '',
      medications: []
    };

    const app = document.getElementById('app');

    function render() {
      app.innerHTML = `
        <div class="min-h-screen pb-12 max-w-2xl mx-auto p-4 space-y-5">
          
          <header class="text-center py-4 border-b border-slate-800">
            <h1 class="text-2xl font-bold text-sky-400">MedVerse Smart EMR Suite</h1>
            <p class="text-xs text-sky-500 font-semibold mt-1">الاستشاري الإكلينيكي الذكي (Powered by DeepSeek AI)</p>
          </header>

          <section class="bg-slate-800/80 p-4 rounded-2xl border border-sky-900/50 space-y-2">
            <div class="flex justify-between items-center">
              <label class="text-xs font-bold text-sky-300 flex items-center gap-1">
                <span>🔑</span> مفتاح Hugging Face Access Token:
              </label>
              ${state.apiKey ? '<span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded-full">محفوظ وآمن ✓</span>' : '<span class="text-[10px] bg-amber-950 text-amber-400 border border-amber-800 px-2 py-0.5 rounded-full">مطلوب المفتاح</span>'}
            </div>
            <div class="flex gap-2">
              <input 
                id="apiKeyInput" 
                type="password" 
                placeholder="hf_..." 
                value="${state.apiKey}" 
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-sky-500" 
              />
              <button id="saveKeyBtn" class="bg-sky-600 hover:bg-sky-500 text-xs font-bold px-4 py-2 rounded-xl text-white transition-all">
                حفظ
              </button>
            </div>
          </section>

          <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
            <h2 class="font-bold text-sm text-slate-200 border-b border-slate-700 pb-2 flex items-center gap-2">
              <span>👤</span> الملف الإكلينيكي والتاريخ المرضي
            </h2>

            <div>
              <label class="block text-xs text-slate-400 mb-1">اسم المريض بالكامل *</label>
              <input id="pName" type="text" placeholder="أدخل اسم المريض..." value="${state.patientName}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" />
            </div>

            <div class="grid grid-cols-3 gap-3">
              <div>
                <label class="block text-xs text-slate-400 mb-1">السن</label>
                <input id="pAge" type="number" placeholder="مثال: 35" value="${state.age}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" />
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">النوع</label>
                <select id="pGender" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500">
                  <option value="ذكر" ${state.gender === 'ذكر' ? 'selected' : ''}>ذكر</option>
                  <option value="أنثى" ${state.gender === 'أنثى' ? 'selected' : ''}>أنثى</option>
                </select>
              </div>
              <div>
                <label class="block text-xs text-slate-400 mb-1">رقم الهاتف</label>
                <input id="pPhone" type="tel" placeholder="01xxxxxxxxx" value="${state.phone}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" />
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">الأمراض المزمنة (ضغط، سكر، إلخ)</label>
              <input id="pChronic" type="text" placeholder="مثال: ارتفاع ضغط الدم، سكر نوع ثاني..." value="${state.chronicDiseases}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" />
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">التاريخ العائلي (Family History)</label>
              <input id="pFamily" type="text" placeholder="مثال: أمراض قلب وراثية، أورام..." value="${state.familyHistory}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" />
            </div>

            <div>
              <label class="block text-xs text-slate-400 mb-1">الأدوية الحالية التي يتناولها المريض</label>
              <input id="pCurrMeds" type="text" placeholder="مثال: كونكور 5 ملغ، أسبرين..." value="${state.currentMedications}" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500" />
            </div>
          </section>

          <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
            <h2 class="font-bold text-sm text-slate-200 border-b border-slate-700 pb-2 flex items-center gap-2">
              <span>🩺</span> الأعراض والشكوى الحالية
            </h2>

            <textarea id="pSymptoms" rows="3" placeholder="صف الأعراض بالتفصيل ومدة بدايتها..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500">${state.symptoms}</textarea>

            <button id="aiBtn" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-sky-600/30 flex items-center justify-center gap-2">
              ${state.analyzing ? '⏳ جاري استدعاء نموذج DeepSeek الطبي (قد يستغرق بضع ثوانٍ للتحميل)...' : '✨ تحليل الحالة وإصدار التقرير بـ DeepSeek AI'}
            </button>

            ${state.apiError ? `
              <div class="bg-red-950/60 border border-red-800 p-4 rounded-xl text-red-300 text-xs space-y-2">
                <strong>❌ خطأ في الاتصال بالسيرفر:</strong>
                <div>${state.apiError}</div>
                <div class="text-[10px] text-slate-400">💡 ملاحظة: إذا كان الخطأ 503، فهذا يعني أن النموذج قيد التحميل المبدئي على سيرفرات Hugging Face، يرجى المحاولة بعد قليل.</div>
              </div>
            ` : ''}

            ${state.aiReport ? `
              <div class="bg-sky-950/40 border border-sky-800 p-4 rounded-xl space-y-3">
                <h3 class="text-xs font-bold text-sky-400">📋 التقرير الطبي المولد بواسطة DeepSeek AI:</h3>
                
                ${state.aiReport.warnings && state.aiReport.warnings.length > 0 ? `
                  <div class="bg-red-950/50 border border-red-800 p-3 rounded-lg text-red-300 text-xs space-y-1">
                    ${state.aiReport.warnings.map(w => `<div>⚠️ ${w}</div>`).join('')}
                  </div>
                ` : ''}

                <div class="text-xs text-slate-200">
                  <strong>التشخيص المقترح:</strong> ${state.aiReport.diagnosis}
                </div>
              </div>
            ` : ''}
          </section>

          <section class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
            <h2 class="font-bold text-sm text-slate-200 border-b border-slate-700 pb-2 flex items-center gap-2">
              <span>📝</span> اعتماد الخطة العلاجية بواسطة الطبيب
            </h2>

            <div>
              <label class="block text-xs text-slate-400 mb-1">التشخيص المعتمد النهائي:</label>
              <textarea id="pDiag" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-sky-500">${state.finalDiagnosis}</textarea>
            </div>

            <div class="space-y-3">
              <h3 class="text-xs font-bold text-sky-400">💊 قائمة الأدوية المعتمدة (${state.medications.length}):</h3>
              ${state.medications.map((m, idx) => `
                <div class="bg-slate-900 border border-slate-700 p-3 rounded-xl space-y-1 relative">
                  <button onclick="removeMed(${idx})" class="absolute left-3 top-3 text-red-400 text-xs font-bold">إزالة ✕</button>
                  <div class="font-bold text-sm text-white">💊 ${m.name}</div>
                  <div class="text-xs text-slate-400"><strong>الجرعة:</strong> ${m.dose}</div>
                  <div class="text-xs text-slate-400"><strong>دواعي الاستعمال:</strong> ${m.reason}</div>
                </div>
              `).join('')}
            </div>
          </section>

          <button id="saveBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-emerald-600/20 text-base">
            اعتماد التقرير وإصدار الروشتة المعتمدة 🖨️
          </button>

        </div>
      `;

      bindEvents();
    }

    function bindEvents() {
      document.getElementById('saveKeyBtn').onclick = () => {
        const val = document.getElementById('apiKeyInput').value.trim();
        if (val) {
          state.apiKey = val;
          localStorage.setItem('MEDVERSE_HF_KEY', val);
          alert('تم حفظ المفتاح بنجاح! 🔑');
          render();
        }
      };

      document.getElementById('pName').onchange = (e) => state.patientName = e.target.value;
      document.getElementById('pAge').onchange = (e) => state.age = e.target.value;
      document.getElementById('pGender').onchange = (e) => state.gender = e.target.value;
      document.getElementById('pPhone').onchange = (e) => state.phone = e.target.value;
      document.getElementById('pChronic').onchange = (e) => state.chronicDiseases = e.target.value;
      document.getElementById('pFamily').onchange = (e) => state.familyHistory = e.target.value;
      document.getElementById('pCurrMeds').onchange = (e) => state.currentMedications = e.target.value;
      document.getElementById('pSymptoms').onchange = (e) => state.symptoms = e.target.value;
      document.getElementById('pDiag').onchange = (e) => state.finalDiagnosis = e.target.value;

      document.getElementById('aiBtn').onclick = handleAiAnalysis;

      document.getElementById('saveBtn').onclick = () => {
        if (!state.patientName.trim()) {
          alert('يرجى إدخال اسم المريض أولاً');
          return;
        }
        alert('تم اعتماد الكشف والتقرير بنجاح! 🚀');
      };
    }

    window.removeMed = function(idx) {
      state.medications.splice(idx, 1);
      render();
    };

    async function handleAiAnalysis() {
      if (!state.apiKey) {
        alert('يرجى إدخال مفتاح Hugging Face أولاً.');
        return;
      }

      const symptoms = document.getElementById('pSymptoms').value;
      if (!symptoms.trim()) {
        alert('يرجى كتابة الأعراض والشكوى الحالية للمريض أولاً.');
        return;
      }

      state.analyzing = true;
      state.apiError = null;
      render();

      const promptText = `أنت استشاري طبي وتعمل كمساعد إكلينيكي. قم بتحليل الملف الإكلينيكي التالي:
- السن: ${state.age || 'غير محدد'}
- النوع: ${state.gender}
- الأمراض المزمنة: ${state.chronicDiseases || 'لا يوجد'}
- التاريخ العائلي: ${state.familyHistory || 'لا يوجد'}
- الأدوية الحالية: ${state.currentMedications || 'لا يوجد'}
- الأعراض: ${symptoms}

أجب بصيغة JSON فقط بهذا الشكل وبدون أي مقدمات أو أكواد ماركداون:
{
  "diagnosis": "التشخيص الدقيق باللغة العربية",
  "warnings": ["أي تحذيرات أو تعارضات دوائية"],
  "medications": [
    {
      "name": "اسم الدواء",
      "dose": "الجرعة التفصيلية",
      "reason": "السبب الطبي"
    }
  ]
}`;

      try {
        const res = await fetch("https://router.huggingface.co/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${state.apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B",
            messages: [{ role: "user", content: promptText }],
            max_tokens: 700,
            temperature: 0.3
          })
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          throw new Error(data.error?.message || data.error || `HTTP Error ${res.status}`);
        }

        let rawText = data.choices[0].message.content;
        
        // استخراج محتوى الـ JSON بذكاء
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error("لم يتم استرجاع تنسيق JSON صحيح من النموذج.");

        const parsed = JSON.parse(jsonMatch[0]);

        state.aiReport = parsed;
        state.finalDiagnosis = parsed.diagnosis || '';
        state.medications = parsed.medications || [];
      } catch (err) {
        state.apiError = err.message;
      } finally {
        state.analyzing = false;
        render();
      }
    }

    render();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          setInterval(() => { reg.update(); }, 30000);
        });
      });
    }
  </script>
</body>
</html>
